<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="docFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0eeff"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="docSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="docTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="lensFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <filter id="docShadow">
      <feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.2"/>
    </filter>
    <filter id="lensShadow">
      <feDropShadow dx="3" dy="6" stdDeviation="8" flood-color="#5b21b6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Doc back page depth -->
  <rect x="48" y="18" width="68" height="88" rx="8" fill="#e9d5ff" opacity="0.6"/>
  <!-- Doc front -->
  <rect x="36" y="12" width="68" height="88" rx="8" fill="url(#docFront)" filter="url(#docShadow)"/>
  <!-- Doc right side 3D -->
  <path d="M104 12 L112 20 L112 108 L104 100 Z" fill="url(#docSide)" opacity="0.7"/>
  <!-- Doc top 3D -->
  <path d="M36 12 L44 4 L112 4 L104 12 Z" fill="url(#docTop)" opacity="0.8"/>
  <!-- Fold corner -->
  <path d="M88 12 L104 12 L104 28 Z" fill="#c4b5fd" opacity="0.5"/>
  <path d="M88 12 L88 28 L104 28" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Doc lines -->
  <rect x="48" y="42" width="44" height="5" rx="2.5" fill="#a78bfa" opacity="0.5"/>
  <rect x="48" y="54" width="44" height="5" rx="2.5" fill="#a78bfa" opacity="0.5"/>
  <rect x="48" y="66" width="30" height="5" rx="2.5" fill="#a78bfa" opacity="0.35"/>
  <!-- ATS bar -->
  <rect x="48" y="80" width="44" height="6" rx="3" fill="#ddd6fe" opacity="0.8"/>
  <rect x="48" y="80" width="30" height="6" rx="3" fill="url(#lensGrad)" opacity="0.7"/>

  <!-- Lens -->
  <circle cx="90" cy="100" r="30" fill="url(#lensFill)" filter="url(#lensShadow)"/>
  <circle cx="90" cy="100" r="30" fill="none" stroke="url(#lensGrad)" stroke-width="7"/>
  <circle cx="90" cy="100" r="22" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <!-- Shine -->
  <circle cx="80" cy="90" r="7" fill="white" opacity="0.35"/>
  <circle cx="76" cy="86" r="3" fill="white" opacity="0.5"/>
  <!-- Crosshair -->
  <line x1="90" y1="78" x2="90" y2="122" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="3,4"/>
  <line x1="68" y1="100" x2="112" y2="100" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="3,4"/>

  <!-- Handle -->
  <line x1="112" y1="122" x2="134" y2="144" stroke="url(#handleGrad)" stroke-width="10" stroke-linecap="round"/>
  <line x1="111" y1="121" x2="128" y2="138" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
</svg>