  </defs>

  <!-- Simplified for small sizes (favicon/navbar, ~16-32px): fewer shapes, thicker
       strokes, no crosshair/shine — those details turn to mush below ~40px.
       See LOGO.svg for the full detailed version used at larger sizes. -->

  <!-- Doc -->
  <rect x="34" y="14" width="70" height="90" rx="9" fill="url(#docFrontSm)"/>
  <path d="M86 14 L104 32 L86 32 Z" fill="#c4b5fd"/>
  <rect x="47" y="46" width="46" height="7" rx="3.5" fill="#a78bfa" opacity="0.65"/>
  <rect x="47" y="60" width="46" height="7" rx="3.5" fill="#a78bfa" opacity="0.65"/>
  <rect x="47" y="74" width="30" height="7" rx="3.5" fill="#a78bfa" opacity="0.45"/>

  <!-- Lens -->
  <circle cx="92" cy="100" r="32" fill="#f5f3ff" stroke="url(#lensGradSm)" stroke-width="9"/>
  <circle cx="83" cy="91" r="7" fill="white" opacity="0.5"/>

  <!-- Handle -->
  <line x1="115" y1="123" x2="138" y2="146" stroke="url(#handleGradSm)" stroke-width="12" stroke-linecap="round"/>
